<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMA Tools - Blender Addons</title>
    <style>
        :root { --bg: #000; --card: #0a0a0c; --card-hover: #16161a; --cream: #f5f5f7; --muted: #86868b; --copper: #c57d4a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--cream); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding: 3rem 2rem; max-width: 1200px; margin: 0 auto; }
        
        .header-section { margin-bottom: 3rem; }
        .category { font-family: monospace; font-size: 0.65rem; color: var(--copper); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
        .page-title { font-size: 2.5rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }

        .features-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; letter-spacing: 0.5px; }
        .features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
        
        .feature-card { 
            background: var(--card); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 12px; 
            padding: 2.5rem;
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            min-height: 180px;
            text-decoration: none;
            position: relative;
            transition: all 0.2s ease;
        }
        .feature-card:hover { 
            border-color: var(--copper); 
            background: var(--card-hover);
            transform: translateY(-2px);
        }
        .card-category {
            font-family: monospace;
            font-size: 0.65rem;
            color: var(--copper);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--cream);
            letter-spacing: -0.01em;
        }

        @media (max-width: 768px) { .features-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    
    <div class="header-section">
        <div class="category">PMA Tools Suite</div>
        <h1 class="page-title">Blender Addons Gallery</h1>
    </div>

    <div class="features-title">Select Addon</div>
    
    <div class="features-grid">
        <a href="kspline-video.html" target="_self" class="feature-card">
            <div>
                <div class="card-category">Modeling / Splines</div>
                <div class="card-title">PMA Splinefree</div>
            </div>
        </a>
        <a href="kforge-video.html" target="_self" class="feature-card">
            <div>
                <div class="card-category">Materials / Texturing</div>
                <div class="card-title">PMA Paint</div>
            </div>
        </a>
        <a href="kmind-video.html" target="_self" class="feature-card">
            <div>
                <div class="card-category">AI / Crowds & Navigation</div>
                <div class="card-title">PMA Mind</div>
            </div>
        </a>
        <a href="kpropath-video.html" target="_self" class="feature-card">
            <div>
                <div class="card-category">Animation / Camera Paths</div>
                <div class="card-title">PMA PATH MotionSuite</div>
            </div>
        </a>
    </div>

</body>
</html>
