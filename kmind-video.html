<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMA Paint - PMA tools</title>
    <style>
        :root { --bg: #000; --cream: #f5f5f7; --muted: #86868b; --copper: #c57d4a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--cream); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:flex; flex-direction:column; min-height:100vh; justify-content:space-between; padding:2rem; }
        .header { display:flex; justify-content:space-between; align-items:center; max-width:1000px; width:100%; margin:0 auto 1.5rem auto; }
        .back-btn { color:var(--muted); text-decoration:none; font-size:0.85rem; transition:color 0.2s; }
        .back-btn:hover { color:var(--cream); }
        .title { font-size:1.1rem; font-weight:600; letter-spacing:-0.01em; color:var(--copper); }
        .video-container { max-width:1000px; width:100%; margin:0 auto; background:#0a0a0c; border-radius:12px; border:1px solid rgba(255,255,255,0.08); overflow:hidden; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; }
        .video-placeholder { color:var(--muted); font-size:0.9rem; }
        .footer { text-align:center; font-size:0.7rem; color:var(--muted); margin-top:2rem; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">&larr; Back to Home</a>
        <div class="title">PMA Paint</div>
    </div>
    
    <div class="video-container">
        <div class="video-placeholder">Video demo coming soon</div>
    </div>

    <footer class="footer">&copy; 2026 PMA tools. All rights reserved.</footer>
</body>
</html>
